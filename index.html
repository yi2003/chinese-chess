<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国象棋 · 经典对弈</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="vignette"></div>

  <!-- 大厅遮罩：创建/加入房间、等待对手、观战提示。可见时拦截棋盘点击 -->
  <div id="lobby" class="hidden">
    <div class="lobby-panel">
      <div class="lobby-brand">中国象棋 · 在线对战</div>
      <div id="lobby-status">正在连接服务器…</div>

      <div id="lobby-menu">
        <button id="btn-create-room" class="lobby-btn primary">创建房间</button>
        <div class="join-row">
          <input id="join-code" maxlength="5" autocomplete="off" placeholder="输入房间码（如 6R9LW）" />
          <button id="btn-join-room" class="lobby-btn">加入</button>
        </div>
        <div class="lobby-divider"></div>
        <button id="btn-local-play" class="lobby-btn ghost">本地双人对弈</button>
        <div id="lobby-err" class="hidden"></div>
      </div>

      <div id="lobby-waiting" class="hidden">
        <div class="room-code-label">房间码</div>
        <div id="lobby-code" class="room-code">XXXXX</div>
        <button id="btn-copy-code" class="lobby-btn">复制房间码</button>
        <div id="lobby-wait-msg">等待对手加入…</div>
        <button id="btn-cancel-room" class="lobby-btn ghost">返回</button>
      </div>

      <div id="lobby-disconnected" class="hidden">
        <div class="room-code-label">连接已断开</div>
        <div class="lobby-note">请刷新页面重新连接</div>
        <button id="btn-reload" class="lobby-btn primary">刷新页面</button>
      </div>
    </div>
  </div>

  <div id="hud">
    <div id="topbar">
      <div id="brand">中国象棋 · 经典对弈</div>
      <span id="roombadge" class="hidden"></span>
      <div id="turn" class="turn red">红方行棋</div>
      <div id="moveinfo">第 1 回合</div>
      <div class="actions">
        <button id="btn-sound">🔊 音效：开</button>
        <button id="btn-restart">🔄 重新开始</button>
        <button id="btn-leave" class="hidden">🚪 离开房间</button>
      </div>
    </div>
    <div id="msg"></div>
  </div>

  <div id="help">
    🖱 左键：点选己方棋子 → 再点高亮格走子（<span class="dot-green"></span>绿=走 · <span class="dot-red"></span>红=吃）　·　滚轮缩放
  </div>

  <div id="banner" class="hidden">
    <div id="banner-title">🏆 红方获胜</div>
    <div id="banner-sub">将死</div>
    <button id="btn-play-again">再来一局</button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/rules.js"></script>
<script src="js/net.js"></script>
<script src="js/audio.js"></script>
<script src="js/board.js"></script>
<script src="js/figures.js"></script>
<script src="js/animations.js"></script>
<script src="js/main.js"></script>
</body>
</html>
